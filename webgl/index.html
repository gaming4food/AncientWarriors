<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ancient Warriors — WebGL Battle (A/B prototype)</title>
<style>
  html,body{margin:0;padding:0;background:#0d0a06;height:100%;overflow:hidden;
    font-family:'Trebuchet MS',system-ui,sans-serif;color:#e8d0a0}
  #wrap{display:flex;flex-direction:column;align-items:center;height:100%;justify-content:center;gap:8px}
  #game{width:375px;height:700px;border:2px solid #8a6a10;border-radius:14px;overflow:hidden;
    box-shadow:0 0 26px rgba(212,160,23,0.3)}
  #hud{width:375px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px}
  #hud button{background:#1a120a;color:#e8c060;border:1px solid #5a4410;border-radius:8px;
    padding:6px 10px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit}
  #hud button:active{filter:brightness(1.3)}
  #stat{color:#8be06a;font-weight:800;margin-left:auto}
  .note{width:375px;font-size:10px;color:#8a7a5a;line-height:1.5}
  b{color:#ffd700}
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <button onclick="AWGL.addEnemies(40)">+40 enemies</button>
    <button onclick="AWGL.stress()">Stress ×500</button>
    <button onclick="AWGL.reset()">Reset</button>
    <button onclick="AWGL.toggleBloom()">Bloom: ON</button>
    <span id="stat">—</span>
  </div>
  <div id="game"></div>
  <div class="note">
    <b>WebGL prototype</b> — same assets, geometry and data as the live game, rendered on the GPU
    via Phaser 3. Use <b>Stress ×500</b> to compare sprite headroom against the Canvas 2D build.
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
